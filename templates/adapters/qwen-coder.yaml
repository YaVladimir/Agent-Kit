version: 1
adapter:
  name: qwen-coder-compatible-cli
  model_family: qwen-coder
  cli_mode: mcp-stdio

instructions:
  system_prompt: prompts/system.md
  corporate_prompt: prompts/corporate.md
  repository_instructions:
    - AGENTS.md
    - QWEN.md
  language: ru

tooling:
  mcp_config_format: qwen-compatible
  mcp_config_path: .qwen/settings.json
  tool_manifest_path: .gigacode-tools.json
  supports_stdio_mcp: true
  supports_function_calling: false
  supports_native_lsp: false
  fallback_search: rg

runtime:
  start_from_repository_root: true
  pass_environment: true
  tool_timeout_ms: 60000

security:
  allow_external_downloads: false
  approved_artifact_source: internal-registry
  allow_secrets_in_context: false
  require_plan_before_edit: true
