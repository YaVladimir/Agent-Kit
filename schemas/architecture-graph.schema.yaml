type: object
required:
  - version
properties:
  version:
    type: integer
  description:
    type: string
  layer_policy:
    type: object
  modules:
    type: array
    items:
      type: object
  endpoints:
    type: array
    items:
      type: object
      properties:
        path:
          type: string
        method:
          type: string
        controller:
          type: string
        service:
          type: string
        repository:
          type: string
        tables:
          type: array
          items:
            type: string
  dependencies:
    type: array
    items:
      type: object
      properties:
        source:
          type: string
        target:
          type: string
        type:
          type: string
        allowed:
          type: boolean
  spring_beans:
    type: array
    items:
      type: object
